<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FADCE0" />
		<title>This page hopped away</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- Deliberately self-contained: no fonts, no CSS file, no JavaScript, so it
		     renders even if the rest of the deploy is broken. -->
		<style>
			:root {
				color-scheme: light;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-content: center;
				gap: 1rem;
				padding: 2rem 1.5rem;
				text-align: center;
				background: #fdf4ee;
				color: #5a2a3c;
				font-family: ui-rounded, 'Segoe UI', system-ui, sans-serif;
				line-height: 1.6;
			}
			h1 {
				margin: 0;
				font-size: clamp(1.75rem, 7vw, 2.5rem);
				font-weight: 600;
			}
			p {
				margin: 0;
				max-width: 26rem;
				margin-inline: auto;
			}
			a {
				justify-self: center;
				min-height: 44px;
				display: inline-flex;
				align-items: center;
				padding: 0.75rem 1.5rem;
				border-radius: 999px;
				background: #a8385a;
				color: #fff;
				font-weight: 600;
				text-decoration: none;
			}
			a:focus-visible {
				outline: 3px solid #d65c7f;
				outline-offset: 3px;
			}
			img {
				width: 88px;
				height: 88px;
				justify-self: center;
			}
		</style>
	</head>
	<body>
		<img src="/favicon.svg" alt="" width="88" height="88" />
		<h1>This page hopped away</h1>
		<p>There is nothing here, but the invitation is just one tap away.</p>
		<a href="/">Go to the invitation</a>
	</body>
</html>
